name: glamzo_saloon
description: Premium salon booking app
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3

  # Auth
  google_sign_in: ^6.2.1

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI & Animations
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^17.2.2
  smooth_page_indicator: ^2.0.1

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.19.0
  http: ^1.6.0

  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  timezone: ^0.9.4

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#0D0B08"
  image: assets/icons/app_icon.png
  color_dark: "#0D0B08"
  image_dark: assets/icons/app_icon.png
  android_12:
    image: assets/icons/app_icon.png
    icon_background_color: "#0D0B08"
    image_dark: assets/icons/app_icon.png
    icon_background_color_dark: "#0D0B08"
  fullscreen: true
  android: true
  ios: true